name: Deploy Agent Tooling site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - "INSTALLATION.md"
      - "COMMANDS.md"
      - "CONFIGURATION.md"
      - "HOOKS.md"
      - "docs/**"
      - "references/runtime-compatibility.md"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and upload Astro site
        uses: withastro/action@v6
        with:
          path: site
          node-version: 24

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
