name: Capture macOS notification evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/capture-macos-notifications.yml"
      - "site/scripts/capture-macos-notifications.sh"
      - "site/scripts/enable-macos-notification-banners.py"
      - "site/scripts/macos-notification-*.swift"
      - "skills/notifications/scripts/notify.sh"

permissions:
  contents: read

jobs:
  capture:
    name: Capture on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture real Notification Center banners
        run: bash site/scripts/capture-macos-notifications.sh .artifacts/macos-notifications

      - name: Summarize captures
        if: success()
        run: |
          for image in .artifacts/macos-notifications/*-macos.png; do
            printf '### `%s`\n\n' "$(basename "$image")" >> "$GITHUB_STEP_SUMMARY"
            sips -g pixelWidth -g pixelHeight "$image" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notification-evidence-${{ matrix.runner }}
          path: .artifacts/macos-notifications
          if-no-files-found: warn
          retention-days: 14
