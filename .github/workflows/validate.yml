name: Validate Git Workflow package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Codex plugin contract
        run: python3 scripts/validate-codex-plugin.py

      - name: Check generated Codex agents
        run: node scripts/generate-codex-agents.mjs --check

      - name: Validate package, hooks, and synchronization
        run: bash scripts/validate.sh
